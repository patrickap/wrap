tool:
  --format: wide
  -v: true
  CAPITAL: true
  under_score: true
  (special): true
  count: 1
  empty: ""
  empty-list: []
  string-list: "[]"
  nested-list: [[]]
  empty-map: {}
  string-map: "{}"
  nested-map: [{}]
  false-flag: false
  items: [[], {}, "", null, false, true, 2, three]
  nil-value: null
  ratio: 1.5
  text: "two words"
  true-flag: true
  zero: 0
  deploy:
    after: true
    force: true
    $args:
      suffix: last
    release:
      stable: true

passthrough:
  before: true
  deploy:
    after: true

rootargs:
  before: true
  $args:
    suffix: root