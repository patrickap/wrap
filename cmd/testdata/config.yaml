program:
  # keys
  --prefix: long
  -p: short
  UPPERCASE: true
  camelCase: true
  "[special]": true

  # values
  nil: null
  int-negative: -1
  int-zero: 0
  int: 1
  float: 0.99
  str-empty: ""
  str-words: "one two three"
  str-list: "[]"
  str-map: "{}"
  bool-false: false
  bool-true: true
  list-empty: []
  map-empty: {}

  # nesting
  nested:
    - null
    - -1
    - 0
    - 1
    - 0.99
    - ""
    - "one two three"
    - "[]"
    - "{}"
    - false
    - true
    - []
    - {}
  
  # arguments
  $args:
    after-args: true
    subcommand:
      after-subcommand: true
  
  # commands
  command:
    after-command: true
    $args:
      after-args: true
    subcommand:
      after-subcommand: true
